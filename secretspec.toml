[project]
name = "mantis"
revision = "1.0"

[profiles.default]
SESSION_SECRET = { description = "Required app session signing and Calendar token encryption key; at least 16 characters. Development runtime only.", required = true }
GOOGLE_SERVICE_ACCOUNT_JSON_BASE64 = { description = "Optional live Google Sheets service-account credential; unused with local memory backend.", required = false }
GOOGLE_OAUTH_CLIENT_SECRET = { description = "Optional Google Calendar OAuth client credential.", required = false }
TWILIO_API_KEY_SECRET = { description = "Optional live Twilio Voice token signing credential.", required = false }
TWILIO_AUTH_TOKEN = { description = "Optional live Twilio REST and webhook authentication credential.", required = false }
TWILIO_CALLER_ID = { description = "Optional live calling phone number; protected as personal data.", required = false }
INBOUND_FORWARD_NUMBER = { description = "Optional inbound forwarding phone number; protected as personal data.", required = false }
DEEPGRAM_API_KEY = { description = "Optional live transcription credential.", required = false }
LLM_API_KEY = { description = "Optional AI provider or proxy authentication credential.", required = false }
RESEARCH_API_KEY = { description = "Optional separate research provider authentication credential.", required = false }
FIRECRAWL_API_KEY = { description = "Optional Firecrawl research credential.", required = false }
OPENAI_API_KEY = { description = "Optional upstream credential for the separately operated LiteLLM proxy; not needed for basic app startup.", required = false }
SALES_LITELLM_MASTER_KEY = { description = "Optional authentication key for the separately operated LiteLLM proxy.", required = false }
APP_PASSWORD_HASH = { description = "Legacy protected input accepted by the schema but unused by current email/password authentication.", required = false }

[scopes.development]
secrets = ["SESSION_SECRET", "GOOGLE_SERVICE_ACCOUNT_JSON_BASE64", "GOOGLE_OAUTH_CLIENT_SECRET", "TWILIO_API_KEY_SECRET", "TWILIO_AUTH_TOKEN", "TWILIO_CALLER_ID", "INBOUND_FORWARD_NUMBER", "DEEPGRAM_API_KEY", "LLM_API_KEY", "RESEARCH_API_KEY", "FIRECRAWL_API_KEY", "OPENAI_API_KEY", "SALES_LITELLM_MASTER_KEY", "APP_PASSWORD_HASH"]
