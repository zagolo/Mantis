[project]
name = "mantis"
revision = "1.0"

[profiles.default]
SESSION_SECRET = { description = "Session signing and token encryption secret; at least 16 characters after trimming. Reuse the securely stored input where available.", required = true }
GOOGLE_SERVICE_ACCOUNT_JSON_BASE64 = { description = "Base64-encoded Google service-account JSON with Sheets API enabled. Share intended campaign Sheets with this account; setup does not create or modify Sheets.", required = true }
LLM_BASE_URL = { description = "Reachable OpenAI-compatible API base URL, including /v1 where required. Use a direct provider or an already available proxy; this setup does not provision a proxy.", required = true }
LLM_API_KEY = { description = "API credential for LLM_BASE_URL. Collected securely; no billable generation probe is authorized by setup.", required = true }
LLM_MODEL = { description = "Model identifier supported by the configured LLM endpoint.", required = true }
LLM_API_MODE = { description = "LLM transport: chat_completions or responses. Omit to use the application's chat_completions default.", required = false }
APP_BASE_URL = { description = "Optional application origin override. Defaults to local http://127.0.0.1:5173. Live Twilio requires an existing public HTTPS origin reaching Fastify; setup does not create a tunnel or deployment.", required = false }
GOOGLE_OAUTH_CLIENT_ID = { description = "Optional Google Calendar web OAuth client ID. Configure together with its secret and the APP_BASE_URL/api/google/calendar/callback redirect URI.", required = false }
GOOGLE_OAUTH_CLIENT_SECRET = { description = "Optional Google Calendar OAuth client secret. Operator consent is still required in Settings; setup sends no invitations.", required = false }
TWILIO_ACCOUNT_SID = { description = "Optional Twilio account SID; configure all six Twilio fields together for live calling.", required = false }
TWILIO_API_KEY_SID = { description = "Optional Twilio Voice API key SID.", required = false }
TWILIO_API_KEY_SECRET = { description = "Optional Twilio Voice API key secret.", required = false }
TWILIO_AUTH_TOKEN = { description = "Optional Twilio auth token for webhook verification and REST operations.", required = false }
TWILIO_TWIML_APP_SID = { description = "Optional existing Twilio TwiML application SID. Setup does not modify provider webhooks.", required = false }
TWILIO_CALLER_ID = { description = "Optional authorized Twilio caller number in E.164 format. Setup places no calls.", required = false }
TWILIO_ALLOWED_COUNTRIES = { description = "Optional comma-separated destination ISO country codes. Application default is US.", required = false }
DEEPGRAM_API_KEY = { description = "Optional Deepgram credential for live transcription; setup does not open transcription streams.", required = false }
RESEARCH_BASE_URL = { description = "Optional separate Responses-compatible research endpoint. Set all three RESEARCH fields together; api.openai.com LLM connections otherwise reuse their connection for research.", required = false }
RESEARCH_API_KEY = { description = "Optional credential for the explicitly configured research endpoint.", required = false }
RESEARCH_MODEL = { description = "Optional research model supporting Responses web search.", required = false }
FIRECRAWL_API_KEY = { description = "Optional Firecrawl research credential supported by the application.", required = false }

[scopes.development]
secrets = ["SESSION_SECRET", "GOOGLE_SERVICE_ACCOUNT_JSON_BASE64", "LLM_BASE_URL", "LLM_API_KEY", "LLM_MODEL", "LLM_API_MODE", "APP_BASE_URL", "GOOGLE_OAUTH_CLIENT_ID", "GOOGLE_OAUTH_CLIENT_SECRET", "TWILIO_ACCOUNT_SID", "TWILIO_API_KEY_SID", "TWILIO_API_KEY_SECRET", "TWILIO_AUTH_TOKEN", "TWILIO_TWIML_APP_SID", "TWILIO_CALLER_ID", "TWILIO_ALLOWED_COUNTRIES", "DEEPGRAM_API_KEY", "RESEARCH_BASE_URL", "RESEARCH_API_KEY", "RESEARCH_MODEL", "FIRECRAWL_API_KEY"]

[scopes.agent]
secrets = ["SESSION_SECRET"]
