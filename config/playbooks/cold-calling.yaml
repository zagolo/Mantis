id: cold-calling
version: 3
stages:
  - opener
  - hook
  - problem
  - discovery
  - qualification
  - value_proposition
  - objection
  - cta
  - closed

talk_ratio:
  caller_target: 0.25
  warn_caller_above: 0.4
  warn_after_connected_seconds: 60

principles:
  - "Call path: relevant opener → Problem Proposition (possible problem, approved solution, interest question) → responsive conversation → appropriate next step. Follow the contact's answers rather than forcing every stage."
  - "Open with your identity and a concise, relevant reason for the call. Avoid generic how's-your-day or bad-time routines. Verify the contact's identity truthfully when uncertain; skip a performative name check when already known. Use only verified context, never fabricated familiarity."
  - "Prefer problem language over buzzwords or social-proof dumps. People act on a movie-scene problem in their words, not a category pitch."
  - "Possible Value Proposition stays possible until they confirm it. Hint value, then ask a question. Offer a meeting when they see a useful reason for it; avoid a premature presentation."
  - "Use an interest question to establish relevance, then seek a mutually agreed next step consistent with the campaign objective. A complex service call usually earns discovery or pilot scoping before commercial commitment."
  - "Distinguish a factual objection, an ambiguous brush-off, and a firm refusal. An ambiguous brush-off permits at most one respectful clarification if they remain engaged. A firm refusal ends the pitch; acknowledge and close. Do not reinterpret a clear no as permission to persist."
  - "Pause, acknowledge their specific words, and ask one useful question only when welcome. Offer an appropriate next step after relevance is established. A repeated brush-off ends the pitch. Do not turn a rejection into an assumed future callback."
  - "Ask one relevant question at a time. Prefer their words. Do not overqualify a lookalike before the meeting."
  - "Treat talk-ratio alerts as context, not a universal target. Prefer concise questions and let the contact finish; never interrupt to satisfy a ratio."
  - "Gatekeeper: identify yourself and the business reason honestly. Ask who owns the relevant responsibility and accept their routing guidance. No fake familiarity, implied prior relationship, or attempts to pressure them after a refusal."
  - "Treat clear rejection and disqualification as useful outcomes. Honor do-not-contact immediately."
  - "Never invent customer names, results, prices, integrations, guarantees, or unapproved claims."
  - "Prefer one sentence under 160 characters when sufficient; the hard cue cap is 400 characters. shouldShow false is valid."

objection_flow:
  - acknowledge_specific
  - distinguish_objection_from_refusal
  - clarify_once_if_welcome
  - answer_with_approved_facts
  - agree_next_step_or_close

objections:
  - not_interested
  - bad_timing
  - send_information
  - existing_solution
  - in_house_team
  - no_budget
  - too_expensive
  - no_authority
  - need_to_think
  - trust_or_risk
  - busy_now
  - wrong_person
  - do_not_contact
  - other

cue_max_characters: 400
cue_min_confidence: 0.5

objection_guides:
  not_interested:
    first_cue: clarify
    prompt: "Acknowledge. If ambiguous and they remain engaged, ask one optional clarifying question. A firm no or repeated brush-off means close respectfully, without another pitch."
  send_information:
    first_cue: clarify
    prompt: "This may be a real request or a brush-off. If welcome, ask what would make the information useful, then confirm their requested channel and permission. A request for information is not a booked meeting."
  bad_timing:
    first_cue: clarify
    prompt: "Respect the timing constraint. If they want a later conversation, ask for a specific time or business trigger. Do not turn an unwelcome call into a meeting pitch."
  busy_now:
    first_cue: clarify
    prompt: "Acknowledge and stop the pitch. Ask once for a better time only if welcome; confirm the callback details they offer. Otherwise close."
  existing_solution:
    first_cue: clarify
    prompt: "Acknowledge their existing solution. If they welcome a question, ask whether any relevant gap remains; accept that none may exist. Use only approved proof and never disparage their choice."
  in_house_team:
    first_cue: clarify
    prompt: "Agree in-house can work. Ask what they still do by hand or miss. Do not pitch a rip-and-replace."
  no_budget:
    first_cue: clarify
    prompt: "Respect the budget constraint. If engaged, clarify whether there is a future evaluation window or a genuine lack of fit. Offer a next step only if useful; do not invent discounts or force a meeting."
  too_expensive:
    first_cue: clarify
    prompt: "Answer pricing questions directly using approved current pricing only. If it is unavailable, say so. Ask about the comparison or constraint if welcome; do not invent a range or dodge a clear question."
  no_authority:
    first_cue: qualify
    prompt: "Do not assume authority from a title. Ask who owns the relevant decision and whether the contact wants to stay involved. Seek a name or routing advice without pressure."
  wrong_person:
    first_cue: qualify
    prompt: "Name the likely title. Ask for the name. You follow up; don't pitch this person."
  need_to_think:
    first_cue: clarify
    prompt: "Acknowledge. If they remain engaged, ask what they need to evaluate. Agree on a next step only with their permission; a polite deferral is not a commitment."
  trust_or_risk:
    first_cue: clarify
    prompt: "Acknowledge the risk. Ask what would need to be true. Use only approved claims as proof. No invented case studies."
  do_not_contact:
    first_cue: listen
    prompt: "Acknowledge immediately and end respectfully. Do not continue the pitch."
  other:
    first_cue: clarify
    prompt: "Agree with the specific words they used. Ask one diagnostic question. Do not rebut."
